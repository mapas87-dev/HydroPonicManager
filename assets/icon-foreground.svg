<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icona Torre Idroponica (da design Canva MAHZBpD5e9E): torre NFT, piantine, goccia -->
  <defs>
    <g id="leafL"><path d="M0 0 C -30 -60 -110 -70 -130 -20 C -110 30 -40 40 0 0 Z" fill="#8fd1a6"/><path d="M0 0 C -40 -12 -80 -20 -112 -22" stroke="#5fa97c" stroke-width="7" fill="none" stroke-linecap="round"/></g>
    <g id="pair"><use href="#leafL" transform="rotate(22)"/><use href="#leafL" transform="rotate(-22) scale(-1,1)"/><circle r="22" fill="#e6f2ea" stroke="#b4c5bc" stroke-width="5"/></g>
  </defs>
  <!-- goccia -->
  <path d="M512 196 C 494 226 480 244 480 262 A 32 32 0 0 0 544 262 C 544 244 530 226 512 196 Z" fill="#e87722"/>
  <path d="M498 266 A 16 16 0 0 0 512 280" stroke="#ffffff" stroke-opacity=".55" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- torre -->
  <rect x="456" y="368" width="112" height="330" rx="40" fill="#ffffff"/>
  <rect x="436" y="352" width="152" height="30" rx="15" fill="#ffffff"/>
  <!-- piantine -->
  <use href="#pair" transform="translate(512 432)"/>
  <use href="#pair" transform="translate(512 534)"/>
  <use href="#pair" transform="translate(512 636)"/>
  <!-- vaso -->
  <path d="M372 690 H652 L628 786 Q624 800 610 800 H414 Q400 800 396 786 Z" fill="#ffffff"/>
  <rect x="360" y="680" width="304" height="28" rx="14" fill="#ffffff"/>
